# CI: lint, type check, test, and audit dependencies.
#
# Security:
#   - uv sync --frozen ensures hash-verified lockfile is authoritative
#   - pip-audit checks for known vulnerabilities in dependencies

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4

      - name: Install dependencies (hash-verified lockfile)
        run: uv sync --frozen --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy sciath_cli/

      - name: Test
        run: uv run pytest tests/ -v

      - name: Audit dependencies
        run: uv run pip-audit
