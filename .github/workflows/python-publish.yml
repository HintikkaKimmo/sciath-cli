# Publish directly from a maintainer-published GitHub Release.
# PyPI Trusted Publisher: this repository, python-publish.yml, environment pypi.
name: Upload Python Package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4
      - name: Verify release tag matches package version
        run: |
          python - <<'CHECK'
          import os
          from sciath_cli import __version__
          expected = f"v{__version__}"
          if os.environ["GITHUB_REF_TYPE"] != "tag" or os.environ["GITHUB_REF_NAME"] != expected:
              raise SystemExit(f"Select the {expected} tag to publish this version")
          CHECK
      - name: Install locked dependencies
        run: uv sync --locked --extra dev --python "${{ matrix.python-version }}"
      - name: Lint, type check, test, and audit
        run: |
          uv run --frozen ruff check .
          uv run --frozen mypy sciath_cli/
          uv run --frozen pytest tests/ -q
          uv run --frozen pip-audit

  release-build:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4
      - name: Build and validate distributions
        run: |
          uv build
          uvx twine check --strict dist/*
      - name: Test clean installs outside the source checkout
        run: |
          for package in dist/*.whl dist/*.tar.gz; do
            smoke_env="$(mktemp -d)/venv"
            uv venv "$smoke_env" --python 3.13
            uv pip install --python "$smoke_env/bin/python" "$package"
            (cd "$RUNNER_TEMP" && "$smoke_env/bin/python" "$GITHUB_WORKSPACE/.github/scripts/smoke_install.py")
          done
      - name: Attest distributions
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-dists
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  pypi-publish:
    needs: release-build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/sciath-cli/
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-dists
          path: dist/
      - name: Publish to PyPI with attestations
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  github-assets:
    needs: [release-build, pypi-publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-dists
          path: dist/
      - name: Attach the published distributions to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz --clobber
