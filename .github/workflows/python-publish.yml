# Publish Python package to PyPI when a GitHub Release is created.
#
# Security:
#   - Trusted publishing via GitHub OIDC (no PyPI tokens stored)
#   - Sigstore signs the sdist and wheel before upload
#   - SLSA Level 2 provenance attached to build artifacts

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write       # PyPI trusted publishing + Sigstore signing
  attestations: write   # SLSA provenance

jobs:
  release-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build release distributions
        run: |
          python -m pip install build
          python -m build

      # Sign sdist and wheel with Sigstore
      - name: Sign distributions with Sigstore
        uses: sigstore/gh-action-sigstore-python@v3.0.0
        with:
          inputs: dist/*.tar.gz dist/*.whl

      # SLSA provenance for the built distributions
      - name: Attest sdist
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tar.gz

      - name: Attest wheel
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.whl

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - release-build
    permissions:
      id-token: write

    environment:
      name: pypi

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
