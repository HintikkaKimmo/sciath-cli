# Release workflow: build sciath CLI binaries and publish to GitHub Releases.
#
# Manual only: standalone binaries are not part of the PyPI release.
# This workflow still needs a sciath.spec and validated native architecture builds.
#
# Matrix:
#   linux/x86_64   — ubuntu-latest (native)
#   linux/aarch64  — ubuntu-latest + QEMU (via docker buildx)
#   macos/arm64    — macos-latest (Apple Silicon runner)
#   macos/x86_64   — macos-13 (last Intel runner)
#
# Security:
#   - Dependencies installed via uv sync --frozen (hash-verified lockfile)
#   - pip-audit checks for known vulnerabilities
#   - Sigstore cosign signs each release artifact (keyless, GitHub OIDC)
#   - SLSA Level 2 provenance via actions/attest-build-provenance
#   - CycloneDX SBOM generated per platform (Python-layer only for PyInstaller builds)
#
# Output: per-platform .tar.gz + .bundle (Sigstore) + .sbom.cdx.json uploaded to GitHub Release.

name: Standalone binaries (manual)

on:
  workflow_dispatch:

permissions:
  contents: write        # create releases and upload assets
  id-token: write        # Sigstore keyless signing via GitHub OIDC
  attestations: write    # SLSA provenance attestations

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4

      - name: Install dependencies (hash-verified lockfile)
        run: uv sync --frozen --extra dev

      - name: Run tests
        run: uv run pytest tests/ -v

      - name: Audit dependencies for known vulnerabilities
        run: uv run pip-audit

  build:
    name: Build ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-latest
            arch: x86_64

          - target: linux-aarch64
            runner: ubuntu-latest
            arch: aarch64
            use_qemu: true

          - target: macos-arm64
            runner: macos-latest
            arch: arm64

          - target: macos-x86_64
            runner: macos-13
            arch: x86_64

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # QEMU for cross-compilation of Linux arm64
      - name: Set up QEMU
        if: matrix.use_qemu
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: linux/arm64

      - name: Install CLI + PyInstaller (hash-verified)
        run: uv sync --frozen --extra dist

      - name: Build binary (--onedir)
        run: uv run pyinstaller sciath.spec --clean --noconfirm

      # Smoke test: verify the binary actually runs
      - name: Smoke test binary
        run: |
          ./dist/sciath/sciath --version
          ./dist/sciath/sciath --help

      - name: Package archive
        run: |
          ARCHIVE="sciath-${{ matrix.target }}.tar.gz"
          tar -czf "${ARCHIVE}" -C dist sciath
          echo "ARCHIVE=${ARCHIVE}" >> $GITHUB_ENV

      # Generate CycloneDX SBOM (Python-layer only; does not cover bundled interpreter/OS libs)
      - name: Generate SBOM
        run: |
          uv run pip install cyclonedx-bom
          uv run cyclonedx-py environment --output-format json \
            --outfile "sciath-${{ matrix.target }}.sbom.cdx.json"

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sciath-${{ matrix.target }}
          path: |
            ${{ env.ARCHIVE }}
            sciath-${{ matrix.target }}.sbom.cdx.json
          retention-days: 1

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum sciath-*.tar.gz sciath-*.sbom.cdx.json > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Sigstore: sign each artifact with cosign (keyless via GitHub OIDC)
      - name: Install cosign
        uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3

      - name: Sign artifacts with Sigstore
        run: |
          cd artifacts
          for f in sciath-*.tar.gz sciath-*.sbom.cdx.json SHA256SUMS.txt; do
            cosign sign-blob --yes --bundle "${f}.bundle" "${f}"
            echo "Signed: ${f}"
          done

      # SLSA Level 2 provenance for each binary
      - name: Attest linux-x86_64
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: artifacts/sciath-linux-x86_64.tar.gz

      - name: Attest linux-aarch64
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: artifacts/sciath-linux-aarch64.tar.gz

      - name: Attest macos-arm64
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: artifacts/sciath-macos-arm64.tar.gz

      - name: Attest macos-x86_64
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: artifacts/sciath-macos-x86_64.tar.gz

      - name: Create Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2
        with:
          files: |
            artifacts/sciath-*.tar.gz
            artifacts/sciath-*.tar.gz.bundle
            artifacts/sciath-*.sbom.cdx.json
            artifacts/sciath-*.sbom.cdx.json.bundle
            artifacts/SHA256SUMS.txt
            artifacts/SHA256SUMS.txt.bundle
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## Verification

            **Sigstore (cosign):**
            ```bash
            cosign verify-blob --bundle sciath-linux-x86_64.tar.gz.bundle \
              --certificate-identity-regexp "github.com/HintikkaKimmo/sciath-cli" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              sciath-linux-x86_64.tar.gz
            ```

            **SLSA provenance (GitHub CLI):**
            ```bash
            gh attestation verify sciath-linux-x86_64.tar.gz --owner HintikkaKimmo
            ```

            **SHA-256 checksums:**
            ```bash
            sha256sum -c SHA256SUMS.txt
            ```

            **SBOM note:** CLI SBOMs cover Python package dependencies only. The PyInstaller
            bundle also includes the Python interpreter and platform libraries not captured
            in the SBOM. For complete dependency visibility, use the Docker image SBOM.
