# Release workflow: build sciath CLI binaries and publish to GitHub Releases.
#
# Triggered by: push of a tag matching v* (e.g. v0.1.0)
#
# Matrix:
#   linux/x86_64   — ubuntu-latest (native)
#   linux/aarch64  — ubuntu-latest + QEMU (via docker buildx)
#   macos/arm64    — macos-latest (Apple Silicon runner)
#   macos/x86_64   — macos-13 (last Intel runner)
#
# Output: one .tar.gz per platform uploaded to the GitHub Release.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # needed to create releases and upload assets

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CLI dev dependencies
        run: pip install -e ".[dev]"

      - name: Run CLI tests
        run: pytest tests/ -v

  build:
    name: Build ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-latest
            arch: x86_64

          - target: linux-aarch64
            runner: ubuntu-latest
            arch: aarch64
            use_qemu: true

          - target: macos-arm64
            runner: macos-latest
            arch: arm64

          - target: macos-x86_64
            runner: macos-13
            arch: x86_64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # QEMU for cross-compilation of Linux arm64
      - name: Set up QEMU
        if: matrix.use_qemu
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      - name: Install CLI + PyInstaller
        run: pip install -e ".[dist]"

      - name: Build binary (--onedir)
        run: pyinstaller sciath.spec --clean --noconfirm

      # Smoke test: verify the binary actually runs
      - name: Smoke test binary
        run: |
          ./dist/sciath/sciath --version
          ./dist/sciath/sciath --help

      - name: Package archive
        run: |
          ARCHIVE="sciath-${{ matrix.target }}.tar.gz"
          tar -czf "${ARCHIVE}" -C dist sciath
          echo "ARCHIVE=${ARCHIVE}" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sciath-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}
          retention-days: 1

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum sciath-*.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/sciath-*.tar.gz
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
