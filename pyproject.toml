[project]
name = "sciath-cli"
dynamic = ["version"]
description = "CRA compliance automation CLI for embedded Linux"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    {name = "Sciath", email = "support@sciath.co"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
keywords = ["cra", "compliance", "vulnerability", "sbom", "vex", "firmware", "embedded"]
dependencies = [
    "typer>=0.12.0",
    "httpx>=0.27.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "mcp>=1.0.0",
]

[project.urls]
Homepage = "https://sciath.io"
Repository = "https://github.com/HintikkaKimmo/sciath-cli"
Changelog = "https://github.com/HintikkaKimmo/sciath-cli/blob/master/CHANGELOG.md"
Issues = "https://github.com/HintikkaKimmo/sciath-cli/issues"

[project.scripts]
sciath = "sciath_cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.30.0",
    "pip-audit>=2.7.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
]
dist = [
    "pyinstaller>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "sciath_cli/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["sciath_cli"]

[tool.hatch.build.targets.wheel.shared-data]

[tool.hatch.build]
include = [
    "sciath_cli/**/*.py",
    "sciath_cli/discovery/packageconfig_maps/*.json",
    "sciath_cli/meta_layer/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
packages = ["sciath_cli"]

[tool.ruff]
target-version = "py311"
line-length = 130

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
